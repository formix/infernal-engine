name: Release

# Runs when a GitHub release is published (e.g. tag "1.2.0").
on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - run: npm run test:dist
      - name: Check that the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match package.json version '$VERSION'."
            exit 1
          fi

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # staged publishing needs npm >= 11.15.0
      - run: npm ci
      - run: npm run dist # also run by "prepack"; explicit so the bundle is always built
      # Stages the release: a maintainer must approve it with 2FA on npmjs.com
      # (Staged Packages tab) or with `npm stage approve <stage-id>`.
      - run: npm stage publish

  upload-bundle:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach files to the GitHub release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Attach the browser bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/infernal-engine.js dist/infernal-engine.js.map --clobber --repo "$GITHUB_REPOSITORY"

  deploy-docs:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run doc:ci
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v5
